# ------------------------------------------------------------
# Site settings. Edit these first.
# ------------------------------------------------------------
title: Digital Forensics Association
short_title: DFA
tagline: Champlain College
description: >-
  The Champlain College Digital Forensics Association. Weekly talks,
  hands-on labs, and CTF practice for anyone interested in DFIR.

# If your repo is named <username>.github.io, leave baseurl empty.
# If it's a project repo (e.g. github.com/cdfa/website), set baseurl: "/website"
url: ""
baseurl: ""

timezone: America/New_York
lang: en-US

# Club details shown on the home page and footer
club:
  meeting_day: Wednesdays
  meeting_time: 7:00 PM
  meeting_location: Room TBD
  email: dfa@example.com
  discord: ""      # e.g. https://discord.gg/xxxxxx
  instagram: ""    # e.g. https://instagram.com/yourclub
  linkedin: ""
  github: ""

# ------------------------------------------------------------
# Content
# ------------------------------------------------------------
# News & event posts live in _posts/
permalink: /news/:year/:month/:title/

# Each meeting-night presentation lives in _presentations/
collections:
  presentations:
    output: true
    permalink: /presentations/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: presentations }
    values: { layout: presentation }
  - scope: { path: "" }
    values: { layout: default }

# ------------------------------------------------------------
# Build (all plugins below are supported by GitHub Pages)
# ------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
